[project]
name = "bracu-rag-backend"
version = "0.1.0"
description = "BRAC University Information Chatbot (RAG) Backend"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.142.2",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "pgvector>=0.3.6",
    "alembic>=1.14.0",
    "structlog>=24.4.0",
    "httpx>=0.28.1",
    "slowapi>=0.1.9",
    "argon2-cffi>=23.1.0",
    "pyjwt>=2.10.1",
    "tenacity>=9.0.0",
    "cachetools>=5.5.0",
    "python-multipart>=0.0.20",
    "email-validator>=2.2.0",
    "sentence-transformers>=3.3.0",
    "pymupdf4llm>=0.0.17",
    "python-docx>=1.1.2",
    "trafilatura>=2.0.0",
    "groq>=0.18.0",
    "faiss-cpu>=1.15.1",
    "chromadb>=1.5.9",
    "curl-cffi>=0.16.3",
]

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.8.4",
    "mypy>=1.13.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["B008", "E501"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

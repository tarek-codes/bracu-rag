services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: bracu-rag-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bracu_rag
    ports:
      - "5432:5432"
    volumes:
      - bracu_rag_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bracu_rag"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  bracu_rag_pgdata:
